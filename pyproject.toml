[project]
name = "navidrome-autoplay"
version = "2.0.0"
description = "Lightweight, self-hosted autoplay / Instant Mix recommendation service for Navidrome"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "aubio>=0.4.9",
    "mutagen>=1.46.0",
    "gunicorn>=21.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.extra-build-variables]
aubio = { CFLAGS = "-Wno-error=incompatible-pointer-types" }

